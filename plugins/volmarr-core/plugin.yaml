manifest_version: 2
name: volmarr-core
version: "0.26.0"
description: "Volmarr's opt-in Hermes composition plugin, beginning with the Verðandi lifecycle bridge."
author: Volmarr Wyrd / RuneForgeAI
homepage: https://github.com/hrabanazviking/hermes-agent-RuneForgeAI-hack
tags:
  - runeforgeai
  - lifecycle
  - verdandi
hooks:
  - on_session_start
  - on_session_end
  - on_session_finalize
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  - post_llm_call
config_schema:
  socket_path:
    type: str
    default: state/runa.sock
    description: "Absolute Verðandi socket path, or a path relative to the active Hermes profile home."
  timeout_ms:
    type: int
    default: 100
    description: "Maximum local socket connection/write time in milliseconds (clamped to 1-1000)."
  source:
    type: str
    default: hermes-agent
    description: "Source label attached to events published to Verðandi."
  cognition_base_url:
    type: str
    default: http://127.0.0.1:18434/v1
    description: "Loopback-only OpenAI-compatible base URL for the local reflex endpoint."
  cognition_api_key_file:
    type: str
    default: secrets/aesir.key
    description: "A.E.S.I.R. bearer-key file, absolute or relative to the active Hermes profile."
  cognition_probe_timeout_ms:
    type: int
    default: 2000
    description: "Local endpoint probe timeout in milliseconds (clamped to 50-10000)."
  cognition_local_input_limit_bytes:
    type: int
    default: 32768
    description: "Largest metadata-declared input eligible for local reflex cognition."
  cognition_request_timeout_ms:
    type: int
    default: 30000
    description: "Local reflex inference timeout in milliseconds (clamped to 1000-3600000)."
  cognition_local_max_tokens:
    type: int
    default: 256
    description: "Largest completion token request allowed through the reflex adapter."
  bifrost_mimir_db_path:
    type: str
    default: memory/runa_memory.db
    description: "Mímir SQLite database path, absolute or relative to the active Hermes profile."
  bifrost_muninn_db_path:
    type: str
    default: memory/muninn_hebbian.db
    description: "Muninn SQLite database path, absolute or relative to the active Hermes profile."
  bifrost_huginn_db_path:
    type: str
    default: memory/huginn_local.db
    description: "Huginn SQLite database path for the direct profile-bound ravens binding (Slice 90), absolute or relative to the active Hermes profile."
  bifrost_reinforcement_enabled:
    type: bool
    default: false
    description: "Allow the explicitly invoked Muninn reinforcement operation (Slice 92). Disabled by default; no automatic or turn-path reinforcement exists."
  bifrost_decay_enabled:
    type: bool
    default: false
    description: "Allow the explicitly invoked Muninn decay operation (Slice 92). Disabled by default."
  bifrost_consolidation_enabled:
    type: bool
    default: false
    description: "Allow the explicitly invoked Muninn consolidation operation (Slice 92). Disabled by default."
  bifrost_ingestion_enabled:
    type: bool
    default: false
    description: "Allow the explicitly invoked Huginn ingestion operation (Slice 92, direct profile-bound Huginn only). Disabled by default."
  present_state_path:
    type: str
    default: memory/present_state.json
    description: "Live present-state JSON path, absolute or relative to the active Hermes profile."
  present_state_max_profile_facts:
    type: int
    default: 40
    description: "Maximum retained profile-scoped present-state facts (clamped to 1-200)."
  present_state_max_session_facts:
    type: int
    default: 20
    description: "Maximum retained facts per session (clamped to 1-100)."
  present_state_render_chars:
    type: int
    default: 4000
    description: "Maximum source characters offered by Present State per turn (clamped to 256-12000)."
  context_packet_max_chars:
    type: int
    default: 6000
    description: "Hard character ceiling for the complete user-side memory packet (clamped to 512-16000)."
  affective_enabled:
    type: bool
    default: false
    description: "Enable the preserved deterministic synthetic affective regulator. Disabled by default."
  affective_render_chars:
    type: int
    default: 2600
    description: "Maximum affective source characters offered to the context packet (clamped to 256-4000)."
  affective_max_recent_events:
    type: int
    default: 40
    description: "Maximum generic regulatory event records retained in profile state (clamped to 1-100)."
  affective_decay:
    type: float
    default: 0.04
    description: "Per-observed-turn movement of synthetic gauges toward their baselines (clamped to 0-0.5)."
  pad_enabled:
    type: bool
    default: true
    description: "Project classified affective events onto a persistent synthetic valence/energy/agency state. Effective only when affective regulation is enabled."
  pad_decay:
    type: float
    default: 0.08
    description: "Per-event-batch movement of synthetic PAD axes toward their baselines (clamped to 0-0.5)."
  affective_verdandi_enabled:
    type: bool
    default: true
    description: "Consume unseen official Verðandi regulatory events when affective regulation is enabled."
  affective_verdandi_recent_count:
    type: int
    default: 32
    description: "Bounded recent-event catch-up window requested from Verðandi (clamped to 1-128)."
  mempalace_path:
    type: str
    default: memory/mempalace
    description: "MemPalace data directory, absolute or relative to the active Hermes profile."
  mempalace_collection_name:
    type: str
    default: mempalace_drawers
    description: "Existing MemPalace Chroma collection used for verbatim episodic drawers."
  openviking_base_url:
    type: str
    default: http://127.0.0.1:1933
    description: "Loopback URL of the local OpenViking context service."
  openviking_probe_timeout_ms:
    type: int
    default: 2000
    description: "OpenViking health timeout in milliseconds (clamped to 50-10000)."
  wyrd_base_url:
    type: str
    default: http://127.0.0.1:8765
    description: "Loopback URL of the official local WYRD HTTP world-model service."
  wyrd_probe_timeout_ms:
    type: int
    default: 2000
    description: "WYRD health timeout in milliseconds (clamped to 50-10000)."
  wyrd_context_enabled:
    type: bool
    default: false
    description: "Add fresh Passive Oracle context to the bounded user-side WORLD STATE packet section. Disabled by default."
  wyrd_context_persona_id:
    type: str
    default: ""
    description: "Lowercase WYRD persona/entity ID used for relevant context-only queries."
  wyrd_context_render_chars:
    type: int
    default: 1800
    description: "Maximum WYRD source characters offered to the central context packet (clamped to 256-4000)."
  identity_enabled:
    type: bool
    default: true
    description: "Create and validate the active profile's stable structured entity identity."
  identity_path:
    type: str
    default: entity/entity.yaml
    description: "Identity YAML path relative to the active Hermes profile; escaping paths fall back to the default."
  relationships_enabled:
    type: bool
    default: true
    description: "Create and expose the active entity's explicit relationship ledger."
  relationships_path:
    type: str
    default: entity/relationships.yaml
    description: "Relationship YAML path relative to the active Hermes profile; escaping paths fall back to the default."
  relationships_history_limit:
    type: int
    default: 100
    description: "Maximum append-only history events retained per relationship (clamped to 1-500)."
  goals_enabled:
    type: bool
    default: true
    description: "Create and expose the active entity's durable explicit goal ledger."
  goals_path:
    type: str
    default: entity/goals.yaml
    description: "Goal YAML path relative to the active Hermes profile; escaping paths fall back to the default."
  goals_history_limit:
    type: int
    default: 100
    description: "Maximum append-only transition events retained per goal (clamped to 1-500)."
  self_model_enabled:
    type: bool
    default: true
    description: "Create and expose the active entity's persistent self-model ledger (Emergent Agency Phase 1)."
  self_model_path:
    type: str
    default: entity/self_model.yaml
    description: "Self-model YAML path relative to the active Hermes profile; escaping paths fall back to the default."
  self_model_evidence_limit:
    type: int
    default: 50
    description: "Maximum evidence entries retained per self-model claim (clamped to 1-50)."
  motivation_enabled:
    type: bool
    default: true
    description: "Create and expose the active entity's intrinsic-motivation drive ledger (Emergent Agency Phase 2). Proposals only; never creates goals."
  motivation_path:
    type: str
    default: entity/motivation.yaml
    description: "Motivation YAML path relative to the active Hermes profile; escaping paths fall back to the default."
  motivation_cooldown_hours:
    type: float
    default: 6
    description: "Cooldown after a drive is satisfied or its proposal is rejected (clamped to 0-168 hours)."
  metacognition_enabled:
    type: bool
    default: true
    description: "Create and expose the active entity's metacognition summary and reflection log (Emergent Agency Phase 3). Conclusions only; never hidden reasoning."
  metacognition_path:
    type: str
    default: entity/metacognition.json
    description: "Metacognition summary JSON path relative to the active Hermes profile; escaping paths fall back to the default."
  metacognition_log_path:
    type: str
    default: entity/reflection_log.jsonl
    description: "Reflection log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  metacognition_log_limit:
    type: int
    default: 500
    description: "Maximum reflection log entries retained by rotation (clamped to 10-500)."
  curiosity_enabled:
    type: bool
    default: true
    description: "Create and expose the active entity's curiosity frontier (Emergent Agency Phase 4). Local steps only; no external research is performed."
  curiosity_path:
    type: str
    default: entity/curiosity.yaml
    description: "Curiosity YAML path relative to the active Hermes profile; escaping paths fall back to the default."
  curiosity_cooldown_hours:
    type: float
    default: 6
    description: "Cooldown after a curiosity question is investigated (clamped to 0-168 hours)."
  curiosity_max_attempts:
    type: int
    default: 3
    description: "Maximum investigation attempts per curiosity question before it defers (clamped to 1-10)."
  autonomy_enabled:
    type: bool
    default: true
    description: "Create and expose the active entity's autonomy policy gate (Emergent Agency Phase 5). Policy is human-authoritative: the runtime reads it and never alters an existing policy file."
  autonomy_policy_path:
    type: str
    default: entity/autonomy_policy.yaml
    description: "Autonomy policy YAML path relative to the active Hermes profile; escaping paths fall back to the default."
  autonomy_state_path:
    type: str
    default: entity/autonomy_state.json
    description: "Autonomy runtime state JSON path relative to the active Hermes profile; escaping paths fall back to the default."
  agency_enabled:
    type: bool
    default: true
    description: "Enable the agency orchestrator (Emergent Agency Phase 6). One explicit invocation runs one bounded cycle and exits; no cycle runs from a session hook."
  agency_journal_path:
    type: str
    default: entity/agency_journal.jsonl
    description: "Agency journal JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  agency_journal_limit:
    type: int
    default: 200
    description: "Maximum agency journal records retained by rotation (clamped to 10-500)."
  agency_max_candidates:
    type: int
    default: 3
    description: "Maximum candidate intentions selected per agency cycle (clamped to 1-10)."
  agency_routine_enabled:
    type: bool
    default: false
    description: "Enable the proposal-only agency review routine (Emergent Agency Phase 7). Disabled by default; the routine executes nothing and only proposes."
  agency_routine_log_path:
    type: str
    default: entity/agency_proposals.jsonl
    description: "Agency routine proposals log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  agency_routine_log_limit:
    type: int
    default: 200
    description: "Maximum agency routine log records retained by rotation (clamped to 10-500)."
  agency_routine_max_proposals:
    type: int
    default: 5
    description: "Maximum proposals collected per agency routine run (clamped to 1-20)."
  agency_routine_max_model_calls:
    type: int
    default: 0
    description: "Maximum model calls per agency routine run (clamped to 0-5). The deterministic routine spends none."
  agency_routine_max_runtime_seconds:
    type: int
    default: 60
    description: "Runtime budget per agency routine run in seconds (clamped to 5-300)."
  local_autonomy_enabled:
    type: bool
    default: true
    description: "Enable limited local autonomy (Emergent Agency Phase 8): the narrow Class 0/1 local action set, always through the Phase 5 autonomy gate. Execution still requires a local/bounded policy mode."
  local_autonomy_log_path:
    type: str
    default: entity/local_actions.jsonl
    description: "Local autonomy log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  local_autonomy_log_limit:
    type: int
    default: 200
    description: "Maximum local autonomy log records retained by rotation (clamped to 10-500)."
  intrinsic_goals_enabled:
    type: bool
    default: true
    description: "Enable durable intrinsic goals (Emergent Agency Phase 9): explicit promotion of drive intent proposals into the schema-v2 goal ledger, with quota, tier arbitration, and user approve/archive/reject."
  intrinsic_goal_quota:
    type: int
    default: 5
    description: "Maximum live intrinsic goals in the ledger (clamped to 0-50)."
  intrinsic_goal_rejection_cooldown_hours:
    type: float
    default: 168
    description: "Cooldown for a user-rejected intrinsic goal's fingerprint; near-duplicates are refused while it runs (clamped to 0-8760 hours)."
  intrinsic_goal_tier_order:
    type: str
    default: ""
    description: "Comma-separated arbitration tier order (explicit_urgent_user, explicit_normal_user, safety_continuity, approved_intrinsic, new_intrinsic); empty or partial values fall back to the roadmap default for missing tiers."
  background_research_enabled:
    type: bool
    default: false
    description: "Enable background curiosity and research (Emergent Agency Phase 10). Disabled by default; one explicit run_once invocation runs one gated local-only research step and exits."
  background_research_log_path:
    type: str
    default: entity/background_research.jsonl
    description: "Background research log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  background_research_log_limit:
    type: int
    default: 200
    description: "Maximum background research log records retained by rotation (clamped to 10-500)."
  background_research_daily_budget:
    type: int
    default: 5
    description: "Maximum completed background research runs per UTC day (clamped to 1-20); the resource-budget gate refuses runs beyond it."
  background_research_min_score:
    type: float
    default: 0.10
    description: "Minimum frontier score a curiosity question needs for the value gate to permit a background research run (clamped to 0-1)."
  self_improvement_enabled:
    type: bool
    default: false
    description: "Enable the autonomous self-improvement sandbox (Emergent Agency Phase 11). Disabled by default; records proposals and pipeline stages only — no patch, branch, test, commit, or push execution happens in this layer."
  self_improvement_log_path:
    type: str
    default: entity/self_improvement.jsonl
    description: "Self-improvement pipeline log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  self_improvement_log_limit:
    type: int
    default: 200
    description: "Maximum self-improvement pipeline log records retained by rotation (clamped to 10-500)."
  self_improvement_max_open:
    type: int
    default: 10
    description: "Maximum simultaneously open (not closed) self-improvement proposals (clamped to 1-50)."
  timescales_enabled:
    type: bool
    default: false
    description: "Enable the multi-timescale cognition registry (Emergent Agency Phase 12). Disabled by default; defines/registers the five §19 timescales against the existing Hermes-cron routines and records explicit run receipts only — no new scheduler, loop, or execution."
  timescales_log_path:
    type: str
    default: entity/timescales.jsonl
    description: "Timescale run-receipt log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  timescales_log_limit:
    type: int
    default: 200
    description: "Maximum timescale log records retained by rotation (clamped to 10-500)."
  layered_self_model_enabled:
    type: bool
    default: false
    description: "Enable the five-layer persistent self-model view (Self-Aware Agency §5). Disabled by default; assembles objective/narrative/ideal/relational/experiential layers deterministically and read-only over the existing claims, goals, and relationships stores, with cross-layer discrepancies made explicit. Owns no writes and no new persistent file."
  awareness_enabled:
    type: bool
    default: false
    description: "Enable the self-awareness layer (Self-Aware Agency §6). Disabled by default; keeps one bounded, replaceable current snapshot (attention, load, uncertainty, active goals, salient discrepancies from the §5 layered model, known blind spots) at the awareness path. Refresh is explicit only — no loop or rumination — and reflection is recommended only on named §6.5 triggers. Requires the layered self-model to be enabled."
  awareness_path:
    type: str
    default: entity/awareness.json
    description: "Awareness snapshot JSON path relative to the active Hermes profile; escaping paths fall back to the default."
  subjective_report_enabled:
    type: bool
    default: false
    description: "Enable subjective self-report (Self-Aware Agency §7). Disabled by default; keeps persona phenomenology reports in their own bounded log, epistemically labelled (self-interpretation, narrative meaning, or spiritual/philosophical belief) and never recorded as — or promoted to — verified runtime facts or telemetry. Recording is explicit only."
  subjective_report_log_path:
    type: str
    default: entity/subjective_reports.jsonl
    description: "Subjective report log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  subjective_report_log_limit:
    type: int
    default: 200
    description: "Maximum subjective report log records retained by rotation (clamped to 10-500)."
  motivation_lifecycle_enabled:
    type: bool
    default: false
    description: "Enable the intrinsic-motivation lifecycle reconciliation (Self-Aware Agency §8). Disabled by default; maps the §8.2 drives onto the existing drive store (direct/alias/missing) and evaluates one drive intent proposal through the §8.5 stages (drive pressure, deduplication, value/identity check, resource check, autonomy-policy check) deterministically and read-only, carrying the §8.4 motivation block. Only an explicit record_evaluation appends to its own bounded log; no goal is created and promotion remains the Phase 9 service's call."
  motivation_lifecycle_log_path:
    type: str
    default: entity/motivation_lifecycle.jsonl
    description: "Motivation lifecycle log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  motivation_lifecycle_log_limit:
    type: int
    default: 200
    description: "Maximum motivation lifecycle log records retained by rotation (clamped to 10-500)."
  reflection_detail_enabled:
    type: bool
    default: false
    description: "Enable detailed reflection records (Self-Aware Agency §9). Disabled by default; keeps the §9.2 detailed record (confidence before/after, assumptions, evidence, error class, self-model change proposals, next test) in its own bounded log beside the Phase 3 metacognition store, with the §9.3 reflection level computed deterministically from the record. Self-model changes are proposal text only and are never applied here (§9.4). Recording is explicit only."
  reflection_detail_log_path:
    type: str
    default: entity/reflections.jsonl
    description: "Reflection detail log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  reflection_detail_log_limit:
    type: int
    default: 200
    description: "Maximum reflection detail log records retained by rotation (clamped to 10-500)."
  curiosity_detail_enabled:
    type: bool
    default: false
    description: "Enable the curiosity detail reconciliation (Self-Aware Agency §10). Disabled by default; keeps §10 assessments (origin from the §10.4 sources, §10.3 priority = uncertainty x usefulness x novelty x identity_relevance x affordability) and §10.6 investigation outcomes in its own bounded log beside the Phase 4 curiosity store, with the §10.5 budget block (investigations/day, local token budget, cloud budget default zero, max minutes, usefulness floor) evaluated deterministically and read-only. No second curiosity engine; recording is explicit only and no investigation is performed here."
  curiosity_detail_log_path:
    type: str
    default: entity/curiosity_details.jsonl
    description: "Curiosity detail log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  curiosity_detail_log_limit:
    type: int
    default: 200
    description: "Maximum curiosity detail log records retained by rotation (clamped to 10-500)."
  curiosity_detail_investigations_per_day:
    type: int
    default: 8
    description: "Maximum curiosity investigations per day under the §10.5 budget (clamped to 0-100)."
  curiosity_detail_local_token_budget_per_day:
    type: int
    default: 50000
    description: "Local token budget per day under the §10.5 budget (clamped to 0-1000000)."
  curiosity_detail_cloud_budget_usd_per_day:
    type: float
    default: 0.0
    description: "Cloud budget in USD per day under the §10.5 budget (clamped to 0-10000). Default zero: cloud research is refused until explicitly configured."
  curiosity_detail_max_minutes_per_investigation:
    type: int
    default: 20
    description: "Maximum minutes per curiosity investigation under the §10.5 budget (clamped to 1-240)."
  curiosity_detail_usefulness_floor:
    type: float
    default: 0.35
    description: "Usefulness floor a curiosity assessment must clear under the §10.5 budget (clamped to 0-1)."
  autonomy_detail_enabled:
    type: bool
    default: false
    description: "Enable the bounded-autonomy reconciliation (Self-Aware Agency §11). Disabled by default; names the §11.3 risk classes, stands the §11.4 permission block with its own defaults (deny can never be upgraded here), reconciles the Phase 5 registry classes against §11.3 read-only (differences surfaced, never silently fixed — the policy is human-authoritative), and records short-lived operation-scoped §11.5 capability grants in its own bounded log. Recording is explicit only; this layer executes nothing and the Phase 5 gate remains the only proposal gate."
  autonomy_detail_log_path:
    type: str
    default: entity/autonomy_grants.jsonl
    description: "Autonomy grant log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  autonomy_detail_log_limit:
    type: int
    default: 200
    description: "Maximum autonomy grant log records retained by rotation (clamped to 10-500)."
  autonomy_detail_default_class_limit:
    type: int
    default: 2
    description: "Default class limit from the §11.4 policy format (clamped to 0-5): allow-default permissions hold only at or below this risk class."
  autonomy_detail_max_grant_hours:
    type: int
    default: 168
    description: "Maximum lifetime in hours of a §11.5 capability grant (clamped to 1-720)."
  agency_cycle_detail_enabled:
    type: bool
    default: false
    description: "Enable the agency-cycle reconciliation (Self-Aware Agency §12). Disabled by default; names the twelve §12 steps in canonical order with an honest coverage mapping against the Emergent Agency Phase 6 orchestrator (Slice 96), supplies the pure seven-factor §12 ranking function, enforces the hard maximum-actions-per-cycle bound at trace-record time, and records explicit cycle traces in its own bounded log. Recording is explicit only; this layer runs no cycle and executes nothing — the Phase 6 orchestrator remains the only cycle."
  agency_cycle_detail_log_path:
    type: str
    default: entity/agency_cycle_traces.jsonl
    description: "Agency cycle trace log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  agency_cycle_detail_log_limit:
    type: int
    default: 200
    description: "Maximum agency cycle trace log records retained by rotation (clamped to 10-500)."
  agency_cycle_detail_max_actions:
    type: int
    default: 3
    description: "Hard maximum executed actions per agency cycle under §12 (clamped to 1-10); a trace exceeding it is refused at record time."
  self_state_enabled:
    type: bool
    default: false
    description: "Enable the SELF STATE context integration (Self-Aware Agency §13): the packet schema v2 SELF STATE section carries at most the seven compact §13 fields (identity summary, current attention, active self-originated goal, major discrepancy, confidence/uncertainty, known limitation, curiosity target), assembled deterministically and read-only from the layered self-model (Slice 103), Phase 9 intrinsic-goal arbitration, and the Phase 4 curiosity frontier. Requires the layered self-model to be enabled; never a full self-model dump. Disabled by default."
  verdandi_events_enabled:
    type: bool
    default: false
    description: "Enable the Verðandi event families (Self-Aware Agency §14): the seventeen content-free §14 event types emitted explicitly through the existing fail-open Verðandi publisher under a strict context allowlist (subject identifier/class, numeric score, reason code, outcome, count — no field can carry free text, reflections, prompts, secrets, or conversation text), with every emission attempt recorded in its own bounded log with its delivered/dropped outcome. Disabled by default; emission is explicit only — no hook, loop, scheduler, or turn-path caller emits, and no owning store is wired to emit yet."
  verdandi_events_log_path:
    type: str
    default: entity/verdandi_events.jsonl
    description: "Verðandi events log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  verdandi_events_log_limit:
    type: int
    default: 200
    description: "Maximum Verðandi events log records retained by rotation (clamped to 10-500)."
  background_life_enabled:
    type: bool
    default: false
    description: "Enable the background-life integration (Self-Aware Agency §15): the four §15 routines registered against Hermes cron (frequent continuity every 10m and daily consolidation every 1440m backed by the existing routines; reflection every 120m and curiosity every 240m paused by default and honestly unbacked), pure §15 gates (reflection only when a trigger is pending; curiosity only for a high-value question, at most one, defaulting to a research proposal), the frequent-continuity extension coverage, and the seven-field daily digest extension — with explicit run receipts in its own bounded log. Disabled by default; this layer installs nothing, runs nothing, and creates no scheduler — Hermes cron remains the only scheduler."
  background_life_log_path:
    type: str
    default: entity/background_life.jsonl
    description: "Background life receipt log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  background_life_log_limit:
    type: int
    default: 200
    description: "Maximum background life receipt log records retained by rotation (clamped to 10-500)."
  persona_canon_enabled:
    type: bool
    default: false
    description: "Enable persona canon evaluation (Self-Aware Agency §16): a human-authored, read-only persona canon file whose assertions carry one of the six §16 seed kinds (narrative self, ideal self, reflection vocabulary, values, preferred practices, philosophical interpretation) and optionally one named deterministic runtime check, evaluated explicitly against runtime facts (memory continuity = the heartbeat probe; live goals, relationships, and verified capabilities from the layered self-model's objective layer when enabled). Canon keeps the persona_canon epistemic basis forever — supported, contradicted, or unverifiable, never a verified runtime fact — and a contradicted assertion surfaces as a persona_vs_runtime discrepancy while the runtime fact stands. Disabled by default; the runtime never writes the canon file."
  persona_canon_path:
    type: str
    default: entity/persona_canon.yaml
    description: "Human-authored persona canon YAML path relative to the active Hermes profile; escaping paths fall back to the default. Read-only to the runtime."
  persona_canon_log_path:
    type: str
    default: entity/persona_canon_evaluations.jsonl
    description: "Persona canon evaluation receipt log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  persona_canon_log_limit:
    type: int
    default: 200
    description: "Maximum persona canon evaluation receipts retained by rotation (clamped to 10-500)."
  persona_runtime_enabled:
    type: bool
    default: false
    description: "Enable the persona runtime foundations (Persona Runtime Roadmap §§3-12): a human-authored, read-only config file naming a persona id, display name, persona directory, and a document map of semantic role to file/required — the runtime cares about roles, not filenames, and extra roles beyond the six core roles are first-class extensions needing no code change. An explicit, deterministic compiler parses the Markdown documents into sections, derives the Layer A persona kernel (bounded to the §5 500-1500 estimated-token band), builds the Layer B section index, and hashes every document and the kernel (Layer C canonical text is compiled, never injected by this layer). §7: kernel, index, and IR carry section text verbatim — no generated summary or paraphrase is ever produced. §8: the compiler also builds PersonaIR, its explicit intermediate artefact — every section classified deterministically (heading keywords, then document role) into exactly one of the thirteen §8 categories, all present in roadmap order, with an ir_hash; the Markdown documents remain canonical, the IR is generated runtime data (never human-edited, never persisted by this layer). §9: the kernel is generated from the roadmap's source mix in formula order — kernel-marked core sections plus rule/boundary-marked sections of the relationship, service bible, and tool policy documents only (deterministic heading marking; no other role enters the kernel), whole sections under the band, with provenance and per-kind counts recorded. §10: the compiled artefact carries the kernel's pinning spec (system runtime rules, then persona kernel, then active context, then user message) and its deterministic kernel hash; actual prompt placement belongs to prompt assembly (§53, later) and is not claimed here. §11: parsing is section-aware — documents split only at heading boundaries (conceptual sections, never arbitrary token chunks), a leading enumeration prefix is stripped from the semantic heading, and every index entry carries the §11 record shape (document, section, heading, content) plus a derived priority (deterministic bands over kernel membership, kernel marking, and IR category — derived, never authored; §16 P0-P4 metadata is later). §12: every section also carries a persistent role-prefixed stable id (role.section), unique across documents and unchanged by renumbering. Compilation is explicit only, writes nothing, and never runs per message. Disabled by default; the runtime never writes the config or any document it names."
  persona_config_path:
    type: str
    default: config/persona.yaml
    description: "Human-authored persona config YAML path relative to the active Hermes profile; escaping paths fall back to the default. Read-only to the runtime."
  blind_spots_enabled:
    type: bool
    default: false
    description: "Enable explicit blind-spot tracking (Self-Aware Agency §17): the thirteen §17 categories with snapshot records carrying category, evidence_count, confidence, mitigation, and last_observed_at in a bounded log. Blind spots discount metacognitive confidence (a pure function supplied for the metacognition surfaces) and never become permanent identity labels — this layer writes no self-model or identity store. Contrary evidence lowers confidence by a fixed step and decays, then retires, the spot; a retired spot can start a fresh cycle on a new observation. Disabled by default; observations and contrary evidence are explicit calls only."
  blind_spots_log_path:
    type: str
    default: entity/blind_spots.jsonl
    description: "Blind spot snapshot log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  blind_spots_log_limit:
    type: int
    default: 200
    description: "Maximum blind spot snapshot records retained by rotation (clamped to 10-500)."
  epistemics_enabled:
    type: bool
    default: false
    description: "Enable the reusable confidence contract (Self-Aware Agency §18): assessments carrying confidence, a basis list drawn from the seven §18 basis values, and last_verified_at in a bounded log, each described by one of the seven §18 epistemic labels. The label is a deterministic function of confidence, basis, and verification — a stored label that disagrees is refused on read, a self-report-only belief stays subjective and a persona-canon-only belief stays symbolic at any confidence, and verified requires a runtime_fact basis at confidence >= 0.9 with last_verified_at present. This layer is a contract plus log; it writes no other store. Disabled by default; assessments are explicit calls only."
  epistemics_log_path:
    type: str
    default: entity/epistemic_assessments.jsonl
    description: "Epistemic assessment log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  epistemics_log_limit:
    type: int
    default: 200
    description: "Maximum epistemic assessment records retained by rotation (clamped to 10-500)."
  heartbeat_enabled:
    type: bool
    default: true
    description: "Enable the entity continuity heartbeat receipt; recurring scheduling remains owned by Hermes cron."
  continuity_path:
    type: str
    default: entity/continuity.json
    description: "Continuity state path relative to the active Hermes profile; escaping paths fall back to the default."
  heartbeat_stale_after_seconds:
    type: int
    default: 900
    description: "Age after which a recorded entity heartbeat is stale (clamped to 60-86400 seconds)."
  consolidation_path:
    type: str
    default: entity/consolidation.json
    description: "Non-destructive consolidation checkpoint path relative to the active Hermes profile."
