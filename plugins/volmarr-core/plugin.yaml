manifest_version: 2
name: volmarr-core
version: "0.8.0"
description: "Volmarr's opt-in Hermes composition plugin, beginning with the Verðandi lifecycle bridge."
author: Volmarr Wyrd / RuneForgeAI
homepage: https://github.com/hrabanazviking/hermes-agent-RuneForgeAI-hack
tags:
  - runeforgeai
  - lifecycle
  - verdandi
hooks:
  - on_session_start
  - on_session_end
  - on_session_finalize
  - pre_tool_call
  - post_tool_call
config_schema:
  socket_path:
    type: str
    default: state/runa.sock
    description: "Absolute Verðandi socket path, or a path relative to the active Hermes profile home."
  timeout_ms:
    type: int
    default: 100
    description: "Maximum local socket connection/write time in milliseconds (clamped to 1-1000)."
  source:
    type: str
    default: hermes-agent
    description: "Source label attached to events published to Verðandi."
  cognition_base_url:
    type: str
    default: http://127.0.0.1:18434/v1
    description: "Loopback-only OpenAI-compatible base URL for the local reflex endpoint."
  cognition_api_key_file:
    type: str
    default: secrets/aesir.key
    description: "A.E.S.I.R. bearer-key file, absolute or relative to the active Hermes profile."
  cognition_probe_timeout_ms:
    type: int
    default: 2000
    description: "Local endpoint probe timeout in milliseconds (clamped to 50-10000)."
  cognition_local_input_limit_bytes:
    type: int
    default: 32768
    description: "Largest metadata-declared input eligible for local reflex cognition."
  cognition_request_timeout_ms:
    type: int
    default: 30000
    description: "Local reflex inference timeout in milliseconds (clamped to 1000-3600000)."
  cognition_local_max_tokens:
    type: int
    default: 256
    description: "Largest completion token request allowed through the reflex adapter."
  bifrost_mimir_db_path:
    type: str
    default: memory/runa_memory.db
    description: "Mímir SQLite database path, absolute or relative to the active Hermes profile."
  bifrost_muninn_db_path:
    type: str
    default: memory/muninn_hebbian.db
    description: "Muninn SQLite database path, absolute or relative to the active Hermes profile."
