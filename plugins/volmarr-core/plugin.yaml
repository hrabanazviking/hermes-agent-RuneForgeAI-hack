manifest_version: 2
name: volmarr-core
version: "0.26.0"
description: "Volmarr's opt-in Hermes composition plugin, beginning with the Verðandi lifecycle bridge."
author: Volmarr Wyrd / RuneForgeAI
homepage: https://github.com/hrabanazviking/hermes-agent-RuneForgeAI-hack
tags:
  - runeforgeai
  - lifecycle
  - verdandi
hooks:
  - on_session_start
  - on_session_end
  - on_session_finalize
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  - post_llm_call
config_schema:
  socket_path:
    type: str
    default: state/runa.sock
    description: "Absolute Verðandi socket path, or a path relative to the active Hermes profile home."
  timeout_ms:
    type: int
    default: 100
    description: "Maximum local socket connection/write time in milliseconds (clamped to 1-1000)."
  source:
    type: str
    default: hermes-agent
    description: "Source label attached to events published to Verðandi."
  cognition_base_url:
    type: str
    default: http://127.0.0.1:18434/v1
    description: "Loopback-only OpenAI-compatible base URL for the local reflex endpoint."
  cognition_api_key_file:
    type: str
    default: secrets/aesir.key
    description: "A.E.S.I.R. bearer-key file, absolute or relative to the active Hermes profile."
  cognition_probe_timeout_ms:
    type: int
    default: 2000
    description: "Local endpoint probe timeout in milliseconds (clamped to 50-10000)."
  cognition_local_input_limit_bytes:
    type: int
    default: 32768
    description: "Largest metadata-declared input eligible for local reflex cognition."
  cognition_request_timeout_ms:
    type: int
    default: 30000
    description: "Local reflex inference timeout in milliseconds (clamped to 1000-3600000)."
  cognition_local_max_tokens:
    type: int
    default: 256
    description: "Largest completion token request allowed through the reflex adapter."
  bifrost_mimir_db_path:
    type: str
    default: memory/runa_memory.db
    description: "Mímir SQLite database path, absolute or relative to the active Hermes profile."
  bifrost_muninn_db_path:
    type: str
    default: memory/muninn_hebbian.db
    description: "Muninn SQLite database path, absolute or relative to the active Hermes profile."
  bifrost_huginn_db_path:
    type: str
    default: memory/huginn_local.db
    description: "Huginn SQLite database path for the direct profile-bound ravens binding (Slice 90), absolute or relative to the active Hermes profile."
  bifrost_reinforcement_enabled:
    type: bool
    default: false
    description: "Allow the explicitly invoked Muninn reinforcement operation (Slice 92). Disabled by default; no automatic or turn-path reinforcement exists."
  bifrost_decay_enabled:
    type: bool
    default: false
    description: "Allow the explicitly invoked Muninn decay operation (Slice 92). Disabled by default."
  bifrost_consolidation_enabled:
    type: bool
    default: false
    description: "Allow the explicitly invoked Muninn consolidation operation (Slice 92). Disabled by default."
  bifrost_ingestion_enabled:
    type: bool
    default: false
    description: "Allow the explicitly invoked Huginn ingestion operation (Slice 92, direct profile-bound Huginn only). Disabled by default."
  present_state_path:
    type: str
    default: memory/present_state.json
    description: "Live present-state JSON path, absolute or relative to the active Hermes profile."
  present_state_max_profile_facts:
    type: int
    default: 40
    description: "Maximum retained profile-scoped present-state facts (clamped to 1-200)."
  present_state_max_session_facts:
    type: int
    default: 20
    description: "Maximum retained facts per session (clamped to 1-100)."
  present_state_render_chars:
    type: int
    default: 4000
    description: "Maximum source characters offered by Present State per turn (clamped to 256-12000)."
  context_packet_max_chars:
    type: int
    default: 6000
    description: "Hard character ceiling for the complete user-side memory packet (clamped to 512-16000)."
  affective_enabled:
    type: bool
    default: false
    description: "Enable the preserved deterministic synthetic affective regulator. Disabled by default."
  affective_render_chars:
    type: int
    default: 2600
    description: "Maximum affective source characters offered to the context packet (clamped to 256-4000)."
  affective_max_recent_events:
    type: int
    default: 40
    description: "Maximum generic regulatory event records retained in profile state (clamped to 1-100)."
  affective_decay:
    type: float
    default: 0.04
    description: "Per-observed-turn movement of synthetic gauges toward their baselines (clamped to 0-0.5)."
  pad_enabled:
    type: bool
    default: true
    description: "Project classified affective events onto a persistent synthetic valence/energy/agency state. Effective only when affective regulation is enabled."
  pad_decay:
    type: float
    default: 0.08
    description: "Per-event-batch movement of synthetic PAD axes toward their baselines (clamped to 0-0.5)."
  affective_verdandi_enabled:
    type: bool
    default: true
    description: "Consume unseen official Verðandi regulatory events when affective regulation is enabled."
  affective_verdandi_recent_count:
    type: int
    default: 32
    description: "Bounded recent-event catch-up window requested from Verðandi (clamped to 1-128)."
  mempalace_path:
    type: str
    default: memory/mempalace
    description: "MemPalace data directory, absolute or relative to the active Hermes profile."
  mempalace_collection_name:
    type: str
    default: mempalace_drawers
    description: "Existing MemPalace Chroma collection used for verbatim episodic drawers."
  openviking_base_url:
    type: str
    default: http://127.0.0.1:1933
    description: "Loopback URL of the local OpenViking context service."
  openviking_probe_timeout_ms:
    type: int
    default: 2000
    description: "OpenViking health timeout in milliseconds (clamped to 50-10000)."
  wyrd_base_url:
    type: str
    default: http://127.0.0.1:8765
    description: "Loopback URL of the official local WYRD HTTP world-model service."
  wyrd_probe_timeout_ms:
    type: int
    default: 2000
    description: "WYRD health timeout in milliseconds (clamped to 50-10000)."
  wyrd_context_enabled:
    type: bool
    default: false
    description: "Add fresh Passive Oracle context to the bounded user-side WORLD STATE packet section. Disabled by default."
  wyrd_context_persona_id:
    type: str
    default: ""
    description: "Lowercase WYRD persona/entity ID used for relevant context-only queries."
  wyrd_context_render_chars:
    type: int
    default: 1800
    description: "Maximum WYRD source characters offered to the central context packet (clamped to 256-4000)."
  identity_enabled:
    type: bool
    default: true
    description: "Create and validate the active profile's stable structured entity identity."
  identity_path:
    type: str
    default: entity/entity.yaml
    description: "Identity YAML path relative to the active Hermes profile; escaping paths fall back to the default."
  relationships_enabled:
    type: bool
    default: true
    description: "Create and expose the active entity's explicit relationship ledger."
  relationships_path:
    type: str
    default: entity/relationships.yaml
    description: "Relationship YAML path relative to the active Hermes profile; escaping paths fall back to the default."
  relationships_history_limit:
    type: int
    default: 100
    description: "Maximum append-only history events retained per relationship (clamped to 1-500)."
  goals_enabled:
    type: bool
    default: true
    description: "Create and expose the active entity's durable explicit goal ledger."
  goals_path:
    type: str
    default: entity/goals.yaml
    description: "Goal YAML path relative to the active Hermes profile; escaping paths fall back to the default."
  goals_history_limit:
    type: int
    default: 100
    description: "Maximum append-only transition events retained per goal (clamped to 1-500)."
  self_model_enabled:
    type: bool
    default: true
    description: "Create and expose the active entity's persistent self-model ledger (Emergent Agency Phase 1)."
  self_model_path:
    type: str
    default: entity/self_model.yaml
    description: "Self-model YAML path relative to the active Hermes profile; escaping paths fall back to the default."
  self_model_evidence_limit:
    type: int
    default: 50
    description: "Maximum evidence entries retained per self-model claim (clamped to 1-50)."
  motivation_enabled:
    type: bool
    default: true
    description: "Create and expose the active entity's intrinsic-motivation drive ledger (Emergent Agency Phase 2). Proposals only; never creates goals."
  motivation_path:
    type: str
    default: entity/motivation.yaml
    description: "Motivation YAML path relative to the active Hermes profile; escaping paths fall back to the default."
  motivation_cooldown_hours:
    type: float
    default: 6
    description: "Cooldown after a drive is satisfied or its proposal is rejected (clamped to 0-168 hours)."
  metacognition_enabled:
    type: bool
    default: true
    description: "Create and expose the active entity's metacognition summary and reflection log (Emergent Agency Phase 3). Conclusions only; never hidden reasoning."
  metacognition_path:
    type: str
    default: entity/metacognition.json
    description: "Metacognition summary JSON path relative to the active Hermes profile; escaping paths fall back to the default."
  metacognition_log_path:
    type: str
    default: entity/reflection_log.jsonl
    description: "Reflection log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  metacognition_log_limit:
    type: int
    default: 500
    description: "Maximum reflection log entries retained by rotation (clamped to 10-500)."
  curiosity_enabled:
    type: bool
    default: true
    description: "Create and expose the active entity's curiosity frontier (Emergent Agency Phase 4). Local steps only; no external research is performed."
  curiosity_path:
    type: str
    default: entity/curiosity.yaml
    description: "Curiosity YAML path relative to the active Hermes profile; escaping paths fall back to the default."
  curiosity_cooldown_hours:
    type: float
    default: 6
    description: "Cooldown after a curiosity question is investigated (clamped to 0-168 hours)."
  curiosity_max_attempts:
    type: int
    default: 3
    description: "Maximum investigation attempts per curiosity question before it defers (clamped to 1-10)."
  autonomy_enabled:
    type: bool
    default: true
    description: "Create and expose the active entity's autonomy policy gate (Emergent Agency Phase 5). Policy is human-authoritative: the runtime reads it and never alters an existing policy file."
  autonomy_policy_path:
    type: str
    default: entity/autonomy_policy.yaml
    description: "Autonomy policy YAML path relative to the active Hermes profile; escaping paths fall back to the default."
  autonomy_state_path:
    type: str
    default: entity/autonomy_state.json
    description: "Autonomy runtime state JSON path relative to the active Hermes profile; escaping paths fall back to the default."
  agency_enabled:
    type: bool
    default: true
    description: "Enable the agency orchestrator (Emergent Agency Phase 6). One explicit invocation runs one bounded cycle and exits; no cycle runs from a session hook."
  agency_journal_path:
    type: str
    default: entity/agency_journal.jsonl
    description: "Agency journal JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  agency_journal_limit:
    type: int
    default: 200
    description: "Maximum agency journal records retained by rotation (clamped to 10-500)."
  agency_max_candidates:
    type: int
    default: 3
    description: "Maximum candidate intentions selected per agency cycle (clamped to 1-10)."
  agency_routine_enabled:
    type: bool
    default: false
    description: "Enable the proposal-only agency review routine (Emergent Agency Phase 7). Disabled by default; the routine executes nothing and only proposes."
  agency_routine_log_path:
    type: str
    default: entity/agency_proposals.jsonl
    description: "Agency routine proposals log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  agency_routine_log_limit:
    type: int
    default: 200
    description: "Maximum agency routine log records retained by rotation (clamped to 10-500)."
  agency_routine_max_proposals:
    type: int
    default: 5
    description: "Maximum proposals collected per agency routine run (clamped to 1-20)."
  agency_routine_max_model_calls:
    type: int
    default: 0
    description: "Maximum model calls per agency routine run (clamped to 0-5). The deterministic routine spends none."
  agency_routine_max_runtime_seconds:
    type: int
    default: 60
    description: "Runtime budget per agency routine run in seconds (clamped to 5-300)."
  local_autonomy_enabled:
    type: bool
    default: true
    description: "Enable limited local autonomy (Emergent Agency Phase 8): the narrow Class 0/1 local action set, always through the Phase 5 autonomy gate. Execution still requires a local/bounded policy mode."
  local_autonomy_log_path:
    type: str
    default: entity/local_actions.jsonl
    description: "Local autonomy log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  local_autonomy_log_limit:
    type: int
    default: 200
    description: "Maximum local autonomy log records retained by rotation (clamped to 10-500)."
  intrinsic_goals_enabled:
    type: bool
    default: true
    description: "Enable durable intrinsic goals (Emergent Agency Phase 9): explicit promotion of drive intent proposals into the schema-v2 goal ledger, with quota, tier arbitration, and user approve/archive/reject."
  intrinsic_goal_quota:
    type: int
    default: 5
    description: "Maximum live intrinsic goals in the ledger (clamped to 0-50)."
  intrinsic_goal_rejection_cooldown_hours:
    type: float
    default: 168
    description: "Cooldown for a user-rejected intrinsic goal's fingerprint; near-duplicates are refused while it runs (clamped to 0-8760 hours)."
  intrinsic_goal_tier_order:
    type: str
    default: ""
    description: "Comma-separated arbitration tier order (explicit_urgent_user, explicit_normal_user, safety_continuity, approved_intrinsic, new_intrinsic); empty or partial values fall back to the roadmap default for missing tiers."
  background_research_enabled:
    type: bool
    default: false
    description: "Enable background curiosity and research (Emergent Agency Phase 10). Disabled by default; one explicit run_once invocation runs one gated local-only research step and exits."
  background_research_log_path:
    type: str
    default: entity/background_research.jsonl
    description: "Background research log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  background_research_log_limit:
    type: int
    default: 200
    description: "Maximum background research log records retained by rotation (clamped to 10-500)."
  background_research_daily_budget:
    type: int
    default: 5
    description: "Maximum completed background research runs per UTC day (clamped to 1-20); the resource-budget gate refuses runs beyond it."
  background_research_min_score:
    type: float
    default: 0.10
    description: "Minimum frontier score a curiosity question needs for the value gate to permit a background research run (clamped to 0-1)."
  self_improvement_enabled:
    type: bool
    default: false
    description: "Enable the autonomous self-improvement sandbox (Emergent Agency Phase 11). Disabled by default; records proposals and pipeline stages only — no patch, branch, test, commit, or push execution happens in this layer."
  self_improvement_log_path:
    type: str
    default: entity/self_improvement.jsonl
    description: "Self-improvement pipeline log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  self_improvement_log_limit:
    type: int
    default: 200
    description: "Maximum self-improvement pipeline log records retained by rotation (clamped to 10-500)."
  self_improvement_max_open:
    type: int
    default: 10
    description: "Maximum simultaneously open (not closed) self-improvement proposals (clamped to 1-50)."
  timescales_enabled:
    type: bool
    default: false
    description: "Enable the multi-timescale cognition registry (Emergent Agency Phase 12). Disabled by default; defines/registers the five §19 timescales against the existing Hermes-cron routines and records explicit run receipts only — no new scheduler, loop, or execution."
  timescales_log_path:
    type: str
    default: entity/timescales.jsonl
    description: "Timescale run-receipt log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  timescales_log_limit:
    type: int
    default: 200
    description: "Maximum timescale log records retained by rotation (clamped to 10-500)."
  layered_self_model_enabled:
    type: bool
    default: false
    description: "Enable the five-layer persistent self-model view (Self-Aware Agency §5). Disabled by default; assembles objective/narrative/ideal/relational/experiential layers deterministically and read-only over the existing claims, goals, and relationships stores, with cross-layer discrepancies made explicit. Owns no writes and no new persistent file."
  awareness_enabled:
    type: bool
    default: false
    description: "Enable the self-awareness layer (Self-Aware Agency §6). Disabled by default; keeps one bounded, replaceable current snapshot (attention, load, uncertainty, active goals, salient discrepancies from the §5 layered model, known blind spots) at the awareness path. Refresh is explicit only — no loop or rumination — and reflection is recommended only on named §6.5 triggers. Requires the layered self-model to be enabled."
  awareness_path:
    type: str
    default: entity/awareness.json
    description: "Awareness snapshot JSON path relative to the active Hermes profile; escaping paths fall back to the default."
  subjective_report_enabled:
    type: bool
    default: false
    description: "Enable subjective self-report (Self-Aware Agency §7). Disabled by default; keeps persona phenomenology reports in their own bounded log, epistemically labelled (self-interpretation, narrative meaning, or spiritual/philosophical belief) and never recorded as — or promoted to — verified runtime facts or telemetry. Recording is explicit only."
  subjective_report_log_path:
    type: str
    default: entity/subjective_reports.jsonl
    description: "Subjective report log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  subjective_report_log_limit:
    type: int
    default: 200
    description: "Maximum subjective report log records retained by rotation (clamped to 10-500)."
  motivation_lifecycle_enabled:
    type: bool
    default: false
    description: "Enable the intrinsic-motivation lifecycle reconciliation (Self-Aware Agency §8). Disabled by default; maps the §8.2 drives onto the existing drive store (direct/alias/missing) and evaluates one drive intent proposal through the §8.5 stages (drive pressure, deduplication, value/identity check, resource check, autonomy-policy check) deterministically and read-only, carrying the §8.4 motivation block. Only an explicit record_evaluation appends to its own bounded log; no goal is created and promotion remains the Phase 9 service's call."
  motivation_lifecycle_log_path:
    type: str
    default: entity/motivation_lifecycle.jsonl
    description: "Motivation lifecycle log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  motivation_lifecycle_log_limit:
    type: int
    default: 200
    description: "Maximum motivation lifecycle log records retained by rotation (clamped to 10-500)."
  reflection_detail_enabled:
    type: bool
    default: false
    description: "Enable detailed reflection records (Self-Aware Agency §9). Disabled by default; keeps the §9.2 detailed record (confidence before/after, assumptions, evidence, error class, self-model change proposals, next test) in its own bounded log beside the Phase 3 metacognition store, with the §9.3 reflection level computed deterministically from the record. Self-model changes are proposal text only and are never applied here (§9.4). Recording is explicit only."
  reflection_detail_log_path:
    type: str
    default: entity/reflections.jsonl
    description: "Reflection detail log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  reflection_detail_log_limit:
    type: int
    default: 200
    description: "Maximum reflection detail log records retained by rotation (clamped to 10-500)."
  curiosity_detail_enabled:
    type: bool
    default: false
    description: "Enable the curiosity detail reconciliation (Self-Aware Agency §10). Disabled by default; keeps §10 assessments (origin from the §10.4 sources, §10.3 priority = uncertainty x usefulness x novelty x identity_relevance x affordability) and §10.6 investigation outcomes in its own bounded log beside the Phase 4 curiosity store, with the §10.5 budget block (investigations/day, local token budget, cloud budget default zero, max minutes, usefulness floor) evaluated deterministically and read-only. No second curiosity engine; recording is explicit only and no investigation is performed here."
  curiosity_detail_log_path:
    type: str
    default: entity/curiosity_details.jsonl
    description: "Curiosity detail log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  curiosity_detail_log_limit:
    type: int
    default: 200
    description: "Maximum curiosity detail log records retained by rotation (clamped to 10-500)."
  curiosity_detail_investigations_per_day:
    type: int
    default: 8
    description: "Maximum curiosity investigations per day under the §10.5 budget (clamped to 0-100)."
  curiosity_detail_local_token_budget_per_day:
    type: int
    default: 50000
    description: "Local token budget per day under the §10.5 budget (clamped to 0-1000000)."
  curiosity_detail_cloud_budget_usd_per_day:
    type: float
    default: 0.0
    description: "Cloud budget in USD per day under the §10.5 budget (clamped to 0-10000). Default zero: cloud research is refused until explicitly configured."
  curiosity_detail_max_minutes_per_investigation:
    type: int
    default: 20
    description: "Maximum minutes per curiosity investigation under the §10.5 budget (clamped to 1-240)."
  curiosity_detail_usefulness_floor:
    type: float
    default: 0.35
    description: "Usefulness floor a curiosity assessment must clear under the §10.5 budget (clamped to 0-1)."
  autonomy_detail_enabled:
    type: bool
    default: false
    description: "Enable the bounded-autonomy reconciliation (Self-Aware Agency §11). Disabled by default; names the §11.3 risk classes, stands the §11.4 permission block with its own defaults (deny can never be upgraded here), reconciles the Phase 5 registry classes against §11.3 read-only (differences surfaced, never silently fixed — the policy is human-authoritative), and records short-lived operation-scoped §11.5 capability grants in its own bounded log. Recording is explicit only; this layer executes nothing and the Phase 5 gate remains the only proposal gate."
  autonomy_detail_log_path:
    type: str
    default: entity/autonomy_grants.jsonl
    description: "Autonomy grant log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  autonomy_detail_log_limit:
    type: int
    default: 200
    description: "Maximum autonomy grant log records retained by rotation (clamped to 10-500)."
  autonomy_detail_default_class_limit:
    type: int
    default: 2
    description: "Default class limit from the §11.4 policy format (clamped to 0-5): allow-default permissions hold only at or below this risk class."
  autonomy_detail_max_grant_hours:
    type: int
    default: 168
    description: "Maximum lifetime in hours of a §11.5 capability grant (clamped to 1-720)."
  agency_cycle_detail_enabled:
    type: bool
    default: false
    description: "Enable the agency-cycle reconciliation (Self-Aware Agency §12). Disabled by default; names the twelve §12 steps in canonical order with an honest coverage mapping against the Emergent Agency Phase 6 orchestrator (Slice 96), supplies the pure seven-factor §12 ranking function, enforces the hard maximum-actions-per-cycle bound at trace-record time, and records explicit cycle traces in its own bounded log. Recording is explicit only; this layer runs no cycle and executes nothing — the Phase 6 orchestrator remains the only cycle."
  agency_cycle_detail_log_path:
    type: str
    default: entity/agency_cycle_traces.jsonl
    description: "Agency cycle trace log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  agency_cycle_detail_log_limit:
    type: int
    default: 200
    description: "Maximum agency cycle trace log records retained by rotation (clamped to 10-500)."
  agency_cycle_detail_max_actions:
    type: int
    default: 3
    description: "Hard maximum executed actions per agency cycle under §12 (clamped to 1-10); a trace exceeding it is refused at record time."
  self_state_enabled:
    type: bool
    default: false
    description: "Enable the SELF STATE context integration (Self-Aware Agency §13): the packet schema v2 SELF STATE section carries at most the seven compact §13 fields (identity summary, current attention, active self-originated goal, major discrepancy, confidence/uncertainty, known limitation, curiosity target), assembled deterministically and read-only from the layered self-model (Slice 103), Phase 9 intrinsic-goal arbitration, and the Phase 4 curiosity frontier. Requires the layered self-model to be enabled; never a full self-model dump. Disabled by default."
  verdandi_events_enabled:
    type: bool
    default: false
    description: "Enable the Verðandi event families (Self-Aware Agency §14): the seventeen content-free §14 event types emitted explicitly through the existing fail-open Verðandi publisher under a strict context allowlist (subject identifier/class, numeric score, reason code, outcome, count — no field can carry free text, reflections, prompts, secrets, or conversation text), with every emission attempt recorded in its own bounded log with its delivered/dropped outcome. Disabled by default; emission is explicit only — no hook, loop, scheduler, or turn-path caller emits, and no owning store is wired to emit yet."
  verdandi_events_log_path:
    type: str
    default: entity/verdandi_events.jsonl
    description: "Verðandi events log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  verdandi_events_log_limit:
    type: int
    default: 200
    description: "Maximum Verðandi events log records retained by rotation (clamped to 10-500)."
  background_life_enabled:
    type: bool
    default: false
    description: "Enable the background-life integration (Self-Aware Agency §15): the four §15 routines registered against Hermes cron (frequent continuity every 10m and daily consolidation every 1440m backed by the existing routines; reflection every 120m and curiosity every 240m paused by default and honestly unbacked), pure §15 gates (reflection only when a trigger is pending; curiosity only for a high-value question, at most one, defaulting to a research proposal), the frequent-continuity extension coverage, and the seven-field daily digest extension — with explicit run receipts in its own bounded log. Disabled by default; this layer installs nothing, runs nothing, and creates no scheduler — Hermes cron remains the only scheduler."
  background_life_log_path:
    type: str
    default: entity/background_life.jsonl
    description: "Background life receipt log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  background_life_log_limit:
    type: int
    default: 200
    description: "Maximum background life receipt log records retained by rotation (clamped to 10-500)."
  persona_canon_enabled:
    type: bool
    default: false
    description: "Enable persona canon evaluation (Self-Aware Agency §16): a human-authored, read-only persona canon file whose assertions carry one of the six §16 seed kinds (narrative self, ideal self, reflection vocabulary, values, preferred practices, philosophical interpretation) and optionally one named deterministic runtime check, evaluated explicitly against runtime facts (memory continuity = the heartbeat probe; live goals, relationships, and verified capabilities from the layered self-model's objective layer when enabled). Canon keeps the persona_canon epistemic basis forever — supported, contradicted, or unverifiable, never a verified runtime fact — and a contradicted assertion surfaces as a persona_vs_runtime discrepancy while the runtime fact stands. Disabled by default; the runtime never writes the canon file."
  persona_canon_path:
    type: str
    default: entity/persona_canon.yaml
    description: "Human-authored persona canon YAML path relative to the active Hermes profile; escaping paths fall back to the default. Read-only to the runtime."
  persona_canon_log_path:
    type: str
    default: entity/persona_canon_evaluations.jsonl
    description: "Persona canon evaluation receipt log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  persona_canon_log_limit:
    type: int
    default: 200
    description: "Maximum persona canon evaluation receipts retained by rotation (clamped to 10-500)."
  persona_runtime_enabled:
    type: bool
    default: false
    description: "Enable the persona runtime foundations (Persona Runtime Roadmap §§3–56): a human-authored, read-only config file naming a persona id, display name, persona directory, and a document map of semantic role to file/required — the runtime cares about roles, not filenames, and extra roles beyond the six core roles are first-class extensions needing no code change. An explicit, deterministic compiler parses the Markdown documents into sections, derives the Layer A persona kernel (bounded to the §5 500-1500 estimated-token band), builds the Layer B section index, and hashes every document and the kernel (Layer C canonical text is compiled, never injected by this layer). §7: kernel, index, and IR carry section text verbatim — no generated summary or paraphrase is ever produced. §8: the compiler also builds PersonaIR, its explicit intermediate artefact — every section classified deterministically (heading keywords, then document role) into exactly one of the thirteen §8 categories, all present in roadmap order, with an ir_hash; the Markdown documents remain canonical, the IR is generated runtime data (never human-edited, never persisted by this layer). §9: the kernel is generated from the roadmap's source mix in formula order — kernel-marked core sections plus rule/boundary-marked sections of the relationship, service bible, and tool policy documents only (deterministic heading marking; no other role enters the kernel), whole sections under the band, with provenance and per-kind counts recorded. §10: the compiled artefact carries the kernel's pinning spec (system runtime rules, then persona kernel, then active context, then user message) and its deterministic kernel hash; actual prompt placement belongs to prompt assembly (§53, which stands below as a pure order surface) and is not claimed here. §11: parsing is section-aware — documents split only at heading boundaries (conceptual sections, never arbitrary token chunks), a leading enumeration prefix is stripped from the semantic heading, and every index entry carries the §11 record shape (document, section, heading, content) plus a derived priority (deterministic bands over kernel membership, kernel marking, and IR category — derived unless a §16 authored level stands). §12: every section also carries a persistent role-prefixed stable id (role.section), unique across documents and unchanged by renumbering. §13: hybrid retrieval over the index is explicit-only and deterministic — keyword matching, document role, section tags, task classification, and derived priority combined into an explainable score returned with every result, named by stable id; the semantic-similarity component is honestly unavailable because this plugin owns no embedding surface (recorded as null in every score, never faked). §14: the persona router is explicit-only — PersonaRouter decides which persona sections a task requires from the five §14 inputs (user message, current task, active project, tool intent, conversation state), selecting per task tag over the §13 scores and naming every required section by its §12 stable id with the tags that required it; it injects nothing. §15: the token budgeter is explicit-only — PersonaContextBudgeter allocates estimated tokens across the four §15 categories (persona kernel 500–1500, dynamic persona retrieval 300–2500, relevant memories 500–3000, project state 500–3000), configurable per category and scaled by model context class (small local models receive each minimum, standard models the suggested maximum, large-context models twice that), trimming whole items only in priority order with excluded items named over_budget; categories spend only their own allocation, and budgeting assembles and injects no prompt (§53 stands as a pure order surface below). §16: the priority system — every section carries a P0-P4 level (P0 identity-critical, P1 strong behavioral rule, P2 important preference, P3 context-specific preference, P4 aesthetic/background detail), authored by a trailing [Pn] heading marker where present (the marker is stripped from the semantic heading, so it never changes a stable id) and otherwise derived deterministically from kernel membership, kernel marking, and IR category, reconciled with the §11 bands; an authored level replaces the derived float (P0 1.00 to P4 0.25). P0 material is never evicted merely to save tokens: kernel generation picks P0 sections even past the §5 ceiling (the kernel surfaces over-band), and the budgeter never excludes a P0 persona-kernel item as over_budget. §17/§18: the human-authored config may also carry bounded anchors (what the character is) and anti_anchors (what the character is not, for drift resistance) lists — validated (bounded count and length, no duplicates, no empty entries) and carried verbatim into the compiled artefact, standing at the head of every kernel ahead of ordinary sections, never evicted to fit the §5 ceiling; changing an anchor changes the kernel hash. §19: every compile carries its stored hash record (persona version, per-document hashes by role, kernel hash, persona hash), unstamped so compiles stay deterministic — a compile timestamp enters a record only as an explicit, validated caller stamp, and a stamp alone never counts as a change; the pure detect_changes function names documents added, removed, or hash-changed between two records. §20: hot reload is an explicit PersonaReloader check, never a resident file watcher — it recompiles, detects hash changes, and walks the reload chain only as far as the hashes require (reparse changed documents, update the PersonaIR, rebuild the retrieval index, recompile the kernel only when its hash changed), returning the previous artefact untouched when nothing changed, with no restart required. §21: change impact detection is a pure function between two compiles — it diffs sections by their §12 stable ids (added, removed, or changed in text, semantic heading, heading level, §8 category, or §16 priority level), classifies each by role, category, priority level, and kernel membership, and reports the most severe impact class (none, patch, minor, major) with kernel rebuild required exactly when the kernel hash changed: an avatar embodiment edit is a patch with no kernel rebuild, a core relationship-authority edit is major with one, an anchor change is major, and a document-hash change with no section change (renumbering, formatting) is a patch. §22: persona versioning — the human-authored config may carry a per-persona version (strict semver, default 0.1.0, distinct from the §19 config format version) that every compile carries; the pure version_record function returns the §22 record (persona_id, persona_version, compiled_at as an explicit validated caller stamp or None, source_hash as the artefact's persona hash), and change_impact suggests the next version from the previous artefact's version under §22 semantics (MAJOR identity or relationship architecture, MINOR new preferences or meaningful behavior extension, PATCH wording, formatting, or minor clarification) — a deterministic suggestion only, confirmed by a human config edit; the runtime never bumps a version itself. §23: conversation drift — the pure drift_defenses function names the seven drift dangers in roadmap order (recent-message dominance, summary mutation, context truncation, assistant self-imitation, memory contamination, user mood overfitting, temporary roleplay overriding identity), each paired with its named defense, its kind (mechanism where a banked surface does the work — the §10 kernel pinning spec, the §7 verbatim rule with the §19/§20 hash-and-reload surfaces, the §15/§16 never-evict rules, the §§17/18 anchors — and rule where the defense stands as a contract rule rather than code in this layer), and the surface it is grounded in; no conversation is monitored. §24: do not derive character from chat history — the pure precedence_order function returns the conceptual priority in roadmap order (PERSONA CORE > RELATIONSHIP MODEL > SERVICE BIBLE > long-term memory > current conversation > temporary emotional state), mapping the three document tiers to the compiler semantic roles (core, relationship, service_bible) with the other three tiers non-document; the pure classify_influence / influence_allowed / precedence_winner / outranks functions classify a claimed source (a canonical document role or name, long-term memory, conversation history or a summary of it, or a temporary state/roleplay) by what it may affect (current mood, immediate context, recent events) and whether it may redefine foundational personality — only a canonical document tier may, and canonical persona always outranks conversational drift. §25: conversation summaries must not define persona — a summary may record state (was frustrated during debugging) but must never become a trait claim (is a frustrated personality); the pure classify_summary_claim function classifies a claim's form by explicit grammatical markers only (trait-form markers win, then temporal/state markers, otherwise unclassified and refused fail-closed), and a summary may record only state-form claims, never defining persona or redefining traits. §26: trait vs state — the pure trait_state_separation / classify_attribute / decayed_strength / state_decay functions stand the explicit separation: traits come from canonical persona files only and never decay; anything sourced from a non-canonical tier is at most a temporary state, however it is claimed, and states decay deterministically under this layer's recorded convention (24-hour half-life, expired below 0.05 strength) without ever becoming traits. §27: the persona watchdog — the pure watchdog_pipeline / watchdog_contract functions name the PersonaWatchdog, whose purpose is not to generate responses but to evaluate them (LLM draft, watchdog, drift score, route: acceptable to output, drift to repair); this layer evaluates no live draft and repairs nothing. §28: drift dimensions — the pure drift_dimensions function names the ten dimensions in roadmap order (identity, tone, relationship, decision behavior, counsel style, initiative, truthfulness, deference, technical competence, boundaries), and the pure drift_score / drift_route functions shape a caller-supplied score record over them (total = the deterministic mean over all ten; unlisted dimensions score 0.0; unknown, duplicated, or out-of-interval values refused) and route it under this layer's recorded threshold convention (total at or above 0.20, or any single dimension at or above 0.25, is significant and routes to repair; otherwise acceptable and routes to output — only significant drift triggers repair, per §29's counsel; the §29 score artefact and §30 repair pipeline stand below). §29: drift score artefact — the pure drift_score_artifact function builds the conceptual artefact in the roadmap YAML shape (a drift mapping with total and per-dimension values over the ten §28 dimensions, plus the routing fields), and the pure validate_drift_score_artifact function recomputes every derived field and refuses an artefact whose total, significance, or route disagrees with its dimensions; only significant drift triggers repair, and tiny stylistic differences are not polished. §30: drift repair — the pure repair_pipeline / repair_contract / repair_plan functions stand the repair pipeline in contract form (draft, identify violated persona anchors, rewrite minimally, verify, deliver; never regenerate everything), reconciled against the §17/§18 anchors (violated anchors are caller-named, bounded and verbatim like the config lists); an insignificant score plans deliver-without-repair with no steps, and this layer rewrites no draft. §31: fast local persona watchdog — the pure local_watchdog_tasks / local_watchdog_contract / watchdog_worker functions name the small local nervous-system model as the ideal watchdog worker: six tasks it performs without expensive heavy inference (persona classification, drift detection, section retrieval, tone checking, memory routing, response scoring), each grounded in a banked surface; the larger model generates difficult content and the local model keeps the personality coherent; this layer runs no model. §32: persona refresh — the pure refresh_triggers / refresh_contents / refresh_contract / refresh_due / refresh_plan functions stand the refresh shape for extremely long sessions (every N messages — this layer's recorded convention is 50 — after context summarization, or after a model switch): a refresh carries exactly the Persona Kernel, the current relationship state, and the relevant Service Bible anchors, preventing slow identity evaporation; this layer watches no session, counts no live messages, assembles none of the contents, and injects nothing. §33: event-based refresh — the pure event_refresh_triggers / event_refresh_contract / event_refresh_due / event_refresh_plan functions extend the §32 shape to the seven named events (context compression, model switch, agent handoff, long idle period, persona file modification, major relationship event, memory consolidation), better than a fixed interval alone: naming an event is naming its occurrence, a due plan carries exactly the §32 contents, no interval is required, and the §32 surface itself is not widened (it still refuses the §33-only events). §34: model switching — the pure model_switch_contract / model_switch_plan / kernel_identity_preserved functions stand the identity surface over the §§9–10 kernel and its hash: every model receives the same canonical Persona Kernel (the model is the engine, the persona system is the identity layer), a switch plan names one kernel hash for both models and refuses a same-model switch or a malformed hash, and identity is preserved exactly when the kernel hash is unchanged across a switch; this layer routes no model, switches nothing, watches for no event, and performs no refresh. §35: persona handoff packet — the pure handoff_contract / handoff_packet / validate_handoff_packet functions stand the packet created when routing to another model, in the roadmap's YAML shape (a persona_handoff mapping with exactly persona_id, the §22 persona_version, kernel named by its §§9–10 hash, current_mode, relationship_state, and relevant_sections by §12 stable id); the builder refuses a section the compiled index does not contain, the validator recomputes the normalised packet from its fields alone, and the whole conversation is never a field. §36: subagent separation — the pure subagent_examples / subagent_contract / subagent_separation functions stand the separation: subagents are not turned into the primary persona (each carries its own identity and role; the roadmap's example roster is Caducea the orchestrator/companion, Völundr the specialized builder, Saga the historian, Eir the repair agent), and the primary persona may delegate while maintaining its own identity; this layer delegates nothing and spawns nothing. §37: persona state — the pure persona_state_contract / persona_state / validate_persona_state functions stand the dynamic runtime object in the roadmap's YAML shape (a persona_state mapping with exactly id, the §22 version, active_mode, emotional_state warmth/playfulness/focus, relationship_state trust, active_project, and current_task; id and version come from a compiled artefact, scored fields are unit-interval numbers, and the builder refuses an active mode outside the §37/§38 mode list); the object is dynamic and must never replace canonical PersonaIR — building or validating one changes no compile, kernel hash, or IR, and this layer stores no state and tracks nothing live. §38: modes — the pure persona_modes / mode_contract / mode_profile functions stand the seven modes in roadmap order (counselor, executor, architect, skald, companion, researcher, forge_worker): a mode modifies emphasis without changing identity, foregrounding parts of the same personality, and an unknown mode is refused; this layer switches no mode live. §39: mode routing — the pure mode_routing_examples / mode_routing_contract / route_mode functions stand the four roadmap examples (coding architect then forge_worker, personal reflection companion then counselor, research researcher, creative article skald) and route a caller-supplied signal (an example name, or task text classified by the §13 lexicon plus the reflection/creative-article tokens) automatically, so the user does not need to manually select a mode; every routed mode is a §38 mode and routing changes no identity, and this layer switches no mode live. §40: persona-aware memory write — the pure memory_write_contract / persona_memory / validate_persona_memory / classify_memory_write functions stand the record an extractor would write (decider, decision, any recommendation considered with its recommender, any persona response) under one neutral template that reproduces the roadmap's correct example exactly, while biased phrasing in the roadmap's incorrect form (ignored good advice and its recorded marker kin) is refused at build time and flagged by classification, so a memory cannot introduce personality drift through biased summarization; this layer writes no memory. §41: memory must not override persona — the pure memory_override_contract / memory_influence_allowed / evaluate_memory_claim / memory_claim_authority functions stand the §24 precedence rule applied to the memory tier: traits remain canonical, memory provides history (current mood, immediate context, and recent events only), repetition never promotes a memory's authority however many memories agree, and a memory claim may be recorded as history only in state form (§25) — a trait-form claim from memory is refused, never a persona definition; this layer reads and retrieves no memory. §42: Service Bible dynamic retrieval — the pure service_bible_topics / classify_service_topics / service_topics_for_section / retrieve_service_bible functions and the explicit PersonaServiceBibleRetriever stand a deterministic selective retrieval over the compiled index, restricted to the service_bible role, indexed by the roadmap's topic list (communication, coding, linux, open_source, ai, documentation, research, project_aesir, attention, adhd), and ranked by the §13 hybrid score; the Bible is never continuously injected and never dumped wholesale, and nothing is injected by this layer. §43: Relationship Model dynamic retrieval — the pure relationship_contexts / classify_relationship_contexts / relationship_contexts_for_section / relationship_retrieval_need / retrieve_relationship_model functions and the explicit PersonaRelationshipRetriever stand a deterministic selective retrieval over the compiled index, restricted to the relationship role and ranked by the §13 hybrid score, for the roadmap's five contexts (disagreement, personal_conversation, advice, emotionally_meaningful_interaction, shared_history_discussion); for routine coding only the relevant relational anchors remain in the kernel and nothing is retrieved dynamically, and nothing is injected by this layer. §44: Tool Policy dynamic retrieval — the pure tool_actions / classify_tool_action / tool_policy_needs / retrieve_tool_policy functions and the explicit PersonaToolPolicyRetriever stand a deterministic selective retrieval over the compiled index, restricted to the tool_policy role, performed only when actual tools are being considered: file reading needs minimal or no extra policy (nothing is retrieved), a git force push retrieves exactly force_push, remote_git_operations, reversibility, and authorization, and the other classified actions carry this layer's recorded needs mapping; this layer executes no tool and injects nothing. §45: Memory Policy usage — the pure memory_policy_occasions / classify_memory_policy_occasions / memory_policy_occasions_for_section / memory_policy_retrieval_need / retrieve_memory_policy functions and the explicit PersonaMemoryPolicyRetriever stand the rule that the model normally does not need the entire Memory Policy in context, because the memory subsystem itself implements it: policy text is retrieved selectively over the compiled index, restricted to the memory_policy role, only on the roadmap's four occasions (resolving_memory_conflicts, deciding_promotion, performing_reflection, explaining_memory_decisions), and behavior should move into code wherever practical; this layer implements no memory subsystem and injects nothing. §46: Avatar Policy usage — the pure avatar_policy_occasions / classify_avatar_occasions / avatar_occasions_for_section / avatar_retrieval_need / retrieve_avatar_policy functions and the explicit PersonaAvatarPolicyRetriever stand the rule that the Avatar file rarely belongs in ordinary text inference: it is retrieved selectively over the compiled index, restricted to the avatar role, only on the roadmap's five occasions (generating_images, controlling_avatar, describing_persona, selecting_expressions, vr_interaction), and the avatar controller can consume structured AvatarIR directly; this layer owns no avatar controller and injects nothing. §47: Policy to Code migration — the pure policy_governs / code_governs / policy_to_code_contract / classify_rule_kinds / governance_for_kind / migration_assessment functions stand the migration of deterministic rules out of prompts into code: the prompt governs personality, judgment, relational_behavior, and nuanced_cognition, and code governs expiration, permissions, limits, routing, formatting, and deterministic_constraints (the roadmap's example: the prompt instruction 'Never include expired memories.' becomes the code rule 'if memory.expired: exclude()'); this layer migrates no live prompt, owns no prompts, and injects nothing. §48: Persona Compilation Cache — the pure compilation_cache_artifacts / compilation_cache_contract / cache_manifest / cache_staleness / validate_cache_manifest functions stand the compile-once cache in manifest form over a compiled artefact (persona_kernel.txt, persona_ir.json, persona_sections.jsonl, persona_embeddings.db, persona_manifest.json — generated artefacts; humans edit only Markdown + YAML configuration), with per-artefact hashes built on the §19 hash record (the embeddings hash honestly null — no embedding surface is owned, §13) and staleness named by recomputation, a caller stamp alone never counting as a change; this layer persists and writes no cache. §49: Generated Directory — the pure generated_source_documents / generated_compiled_artifacts / generated_directory_layout / generated_directory_contract functions stand the recommended layout (persona/source/ holding the six authored Caducea documents in roadmap order, persona/.compiled/ holding the generated persona_ir.json, persona_kernel.txt, sections.jsonl, embeddings.db, and manifest.json — the §49 compiled names, two of which differ from the §48 cache names), with .compiled/ regenerable at any time; this layer creates no directory and writes no file. §50: Manifest — the pure manifest / manifest_staleness / validate_manifest functions stand the manifest in the roadmap's JSON shape (persona_id, the §22 version, compiled_at as an explicit validated caller stamp or null, documents by role each with file and hash, and kernel_hash) built on the §19 hash record, the per-document file+hash entries being the gap §50 adds over the §48 cache manifest; this layer writes no manifest. §51: Startup Sequence — the pure startup_steps / startup_contract / startup_plan functions stand the Hermes startup order (load persona.yaml, resolve the persona directory, validate required documents, compare source hashes, then load the compiled persona if the hashes are unchanged or compile it if they changed or none was compiled, load the Persona Kernel, initialize the retrieval index, initialize Persona State, and the persona awakens) as a pure plan over two compiled artefacts' §19 hash records; this layer owns no boot hook and starts nothing. §52: Request Pipeline — the pure request_pipeline_stages / request_pipeline_contract / request_pipeline_plan functions name the ten per-request stages in roadmap order (user message, task classifier, persona router, persona retrieval, memory retrieval, context budgeter, prompt assembler, model, persona watchdog, tools / response), each with its banked owner surface where one stands in this plugin (§13 task classification, §14 router, §13 retrieval, §15 budgeter, §27 watchdog), an external owner where the stage belongs elsewhere (the caller, the memory subsystem, the model); prompt assembly's owner is the §53 pure order surface below; the task classifier's four outputs (task type, entities, project, tool intent) are validated in shape only, and this layer runs no per-message pipeline. §53: Prompt Assembly Order — the pure prompt_assembly_order / prompt_assembly_contract / prompt_assembly_plan functions stand the recommended prompt order in roadmap order (runtime system rules, Persona Kernel, current Persona State, relevant persona sections, relevant long-term memory, active project context, recent conversation context, current user message), the section the §10 pinning spec designated as its enforcer: the kernel sits at position 1, directly under the runtime system rules, and the character appears before transient context; a caller-supplied slot list is validated as an order-preserving subsequence of the canonical order, and this layer assembles no prompt and is not wired into the turn path. §54: Why Order Matters — the pure order_matters_reasons / order_matters_contract / evaluate_prompt_order functions stand the roadmap's two reasons (if persona comes after huge conversation history, recent context may dominate; putting identity near the highest-level instructions helps keep the model anchored) and evaluate a caller-supplied order against them, naming the kernel position, whether character precedes transient context, whether the order is anchored, and the risks when it is not; this layer reorders nothing live. §55: Conversation History Compression — the pure compression_components / compression_contract / compression_plan functions stand the compression shape (a recent verbatim window of the last 8–20 messages plus structured conversation state plus episodic summaries plus retrieved older memories, instead of endlessly appending messages) and plan it as pure arithmetic over caller-supplied counts; this layer compresses no live history, summarises nothing, and retrieves no memory. §56: Long-Term Conversation Design — the pure long_term_design / long_term_design_contract / placement_for functions stand the placements (identity lives in persona, history lives in memory, task state lives in project/context, the conversation window handles immediacy) so the model never needs the entire conversation history to remain itself; this layer places nothing live. Compilation, retrieval, routing, budgeting, reload checks, impact classification, and drift/precedence, summary-claim, trait/state, watchdog/drift-score, drift-artefact, repair-plan, local-watchdog, refresh, event-refresh, model-switch, handoff-packet, subagent, persona-state, mode, memory-override, relationship, tool-policy, service-bible, policy-to-code, compilation-cache, generated-directory, manifest, startup-plan, request-pipeline, prompt-assembly-plan, order-evaluation, history-compression-plan, and long-term-placement classification are explicit only, write nothing, and never run per message. Disabled by default; the runtime never writes the config or any document it names."
  persona_config_path:
    type: str
    default: config/persona.yaml
    description: "Human-authored persona config YAML path relative to the active Hermes profile; escaping paths fall back to the default. Read-only to the runtime."
  blind_spots_enabled:
    type: bool
    default: false
    description: "Enable explicit blind-spot tracking (Self-Aware Agency §17): the thirteen §17 categories with snapshot records carrying category, evidence_count, confidence, mitigation, and last_observed_at in a bounded log. Blind spots discount metacognitive confidence (a pure function supplied for the metacognition surfaces) and never become permanent identity labels — this layer writes no self-model or identity store. Contrary evidence lowers confidence by a fixed step and decays, then retires, the spot; a retired spot can start a fresh cycle on a new observation. Disabled by default; observations and contrary evidence are explicit calls only."
  blind_spots_log_path:
    type: str
    default: entity/blind_spots.jsonl
    description: "Blind spot snapshot log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  blind_spots_log_limit:
    type: int
    default: 200
    description: "Maximum blind spot snapshot records retained by rotation (clamped to 10-500)."
  epistemics_enabled:
    type: bool
    default: false
    description: "Enable the reusable confidence contract (Self-Aware Agency §18): assessments carrying confidence, a basis list drawn from the seven §18 basis values, and last_verified_at in a bounded log, each described by one of the seven §18 epistemic labels. The label is a deterministic function of confidence, basis, and verification — a stored label that disagrees is refused on read, a self-report-only belief stays subjective and a persona-canon-only belief stays symbolic at any confidence, and verified requires a runtime_fact basis at confidence >= 0.9 with last_verified_at present. This layer is a contract plus log; it writes no other store. Disabled by default; assessments are explicit calls only."
  epistemics_log_path:
    type: str
    default: entity/epistemic_assessments.jsonl
    description: "Epistemic assessment log JSONL path relative to the active Hermes profile; escaping paths fall back to the default."
  epistemics_log_limit:
    type: int
    default: 200
    description: "Maximum epistemic assessment records retained by rotation (clamped to 10-500)."
  heartbeat_enabled:
    type: bool
    default: true
    description: "Enable the entity continuity heartbeat receipt; recurring scheduling remains owned by Hermes cron."
  continuity_path:
    type: str
    default: entity/continuity.json
    description: "Continuity state path relative to the active Hermes profile; escaping paths fall back to the default."
  heartbeat_stale_after_seconds:
    type: int
    default: 900
    description: "Age after which a recorded entity heartbeat is stale (clamped to 60-86400 seconds)."
  consolidation_path:
    type: str
    default: entity/consolidation.json
    description: "Non-destructive consolidation checkpoint path relative to the active Hermes profile."
